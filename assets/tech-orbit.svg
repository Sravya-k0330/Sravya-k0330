<svg width="700" height="700" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9C0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D9C0" stop-opacity="0"/>
    </radialGradient>
    <style>
      .label{ font-family:'Courier New', monospace; font-size:15px; font-weight:700; fill:#0B0E14; }
      .ring{ fill:none; stroke:#232936; stroke-width:1; stroke-dasharray:4 6; }
    </style>
  </defs>

  <rect width="700" height="700" fill="none"/>

  <!-- orbit guide rings -->
  <circle class="ring" cx="350" cy="350" r="120"/>
  <circle class="ring" cx="350" cy="350" r="220"/>
  <circle class="ring" cx="350" cy="350" r="320"/>

  <!-- glow + core -->
  <circle cx="350" cy="350" r="90" fill="url(#coreGlow)"/>
  <circle cx="350" cy="350" r="48" fill="#12161F" stroke="#00D9C0" stroke-width="2"/>
  <text x="350" y="345" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#00D9C0">AI/ML</text>
  <text x="350" y="362" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#8B7FFF">ENGINEER</text>

  <!-- RING 1 (radius 120) rotating clockwise -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 350 350" to="360 350 350" dur="18s" repeatCount="indefinite"/>
    <g transform="translate(470,350)">
      <circle r="34" fill="#00D9C0"/>
      <text class="label" x="0" y="5" text-anchor="middle">Py</text>
    </g>
    <g transform="translate(230,350)">
      <circle r="34" fill="#8B7FFF"/>
      <text class="label" x="0" y="5" text-anchor="middle">SQL</text>
    </g>
    <g transform="translate(350,230)">
      <circle r="34" fill="#FFB86B"/>
      <text class="label" x="0" y="5" text-anchor="middle">API</text>
    </g>
    <g transform="translate(350,470)">
      <circle r="34" fill="#00D9C0"/>
      <text class="label" x="0" y="5" text-anchor="middle">SKL</text>
    </g>
  </g>

  <!-- RING 2 (radius 220) rotating counter-clockwise, slower -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 350 350" to="0 350 350" dur="26s" repeatCount="indefinite"/>
    <g transform="translate(570,350)">
      <circle r="38" fill="#8B7FFF"/>
      <text class="label" x="0" y="5" text-anchor="middle">RAG</text>
    </g>
    <g transform="translate(130,350)">
      <circle r="38" fill="#00D9C0"/>
      <text class="label" x="0" y="5" text-anchor="middle">MLOps</text>
    </g>
    <g transform="translate(350,130)">
      <circle r="38" fill="#FFB86B"/>
      <text class="label" x="0" y="5" text-anchor="middle">Docker</text>
    </g>
    <g transform="translate(350,570)">
      <circle r="38" fill="#8B7FFF"/>
      <text class="label" x="0" y="5" text-anchor="middle">K8s</text>
    </g>
    <g transform="translate(505,195)">
      <circle r="34" fill="#00D9C0"/>
      <text class="label" x="0" y="5" text-anchor="middle">LLM</text>
    </g>
    <g transform="translate(195,505)">
      <circle r="34" fill="#FFB86B"/>
      <text class="label" x="0" y="5" text-anchor="middle">CI/CD</text>
    </g>
  </g>

  <!-- RING 3 (radius 320) rotating clockwise, slowest -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 350 350" to="360 350 350" dur="36s" repeatCount="indefinite"/>
    <g transform="translate(670,350)">
      <circle r="30" fill="#FFB86B"/>
      <text class="label" x="0" y="5" text-anchor="middle" font-size="12">Spark</text>
    </g>
    <g transform="translate(30,350)">
      <circle r="30" fill="#00D9C0"/>
      <text class="label" x="0" y="5" text-anchor="middle" font-size="11">Kafka</text>
    </g>
    <g transform="translate(350,30)">
      <circle r="30" fill="#8B7FFF"/>
      <text class="label" x="0" y="5" text-anchor="middle" font-size="11">Airflow</text>
    </g>
    <g transform="translate(350,670)">
      <circle r="30" fill="#00D9C0"/>
      <text class="label" x="0" y="5" text-anchor="middle" font-size="12">Snowflake</text>
    </g>
    <g transform="translate(576,124)">
      <circle r="28" fill="#8B7FFF"/>
      <text class="label" x="0" y="5" text-anchor="middle" font-size="10">MLflow</text>
    </g>
    <g transform="translate(124,576)">
      <circle r="28" fill="#FFB86B"/>
      <text class="label" x="0" y="5" text-anchor="middle" font-size="9">Prometheus</text>
    </g>
    <g transform="translate(576,576)">
      <circle r="28" fill="#00D9C0"/>
      <text class="label" x="0" y="5" text-anchor="middle" font-size="12">AWS</text>
    </g>
    <g transform="translate(124,124)">
      <circle r="28" fill="#8B7FFF"/>
      <text class="label" x="0" y="5" text-anchor="middle" font-size="9">dbt</text>
    </g>
  </g>
</svg>
