<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="55%" stop-color="#1A1033"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9C0"/>
      <stop offset="100%" stop-color="#8B7FFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="150" fill="url(#bgGrad)"/>

  <!-- faint dot grid for texture -->
  <g opacity="0.25">
    <circle cx="40" cy="30" r="1.4" fill="#00D9C0"/>
    <circle cx="90" cy="110" r="1.4" fill="#8B7FFF"/>
    <circle cx="740" cy="25" r="1.4" fill="#8B7FFF"/>
    <circle cx="700" cy="120" r="1.4" fill="#00D9C0"/>
    <circle cx="60" cy="70" r="1.4" fill="#8B7FFF"/>
    <circle cx="760" cy="75" r="1.4" fill="#00D9C0"/>
  </g>

  <text x="400" y="78" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif"
        font-size="46" font-weight="700" letter-spacing="6" fill="url(#textGrad)" filter="url(#glow)">
    SRAVYA K.
  </text>

  <text x="400" y="112" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="15" letter-spacing="4" fill="#8A93A6">
    AI/ML ENGINEER &#8226; MLOPS &#8226; GENAI/RAG
  </text>
</svg>
